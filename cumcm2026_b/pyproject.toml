[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cumcm2026-b"
version = "0.1.0"
description = "Geometry, planning, and learning tools for CUMCM 2026 problem B"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
